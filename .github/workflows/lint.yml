name: lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck --version | head -2
          shellcheck -S warning build.sh install.sh nvidia-proprietary.sh
      - name: bash -n
        run: bash -n build.sh install.sh nvidia-proprietary.sh

  container:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: build the toolchain image
        run: docker build -t nvbuild-truenas:ci docker
      - name: toolchain sanity
        run: |
          docker run --rm nvbuild-truenas:ci sh -c 'gcc --version | head -1; make --version | head -1; mksquashfs -version | head -1; depmod -V'
